[workspace]
resolver = "3"
members = [".", "dylib"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

[workspace.dependencies]
# The contract, from the repository of the host (docs/MODULES_PLAN.md there): the commit of its tag
# sdk-<contract>.
geko-module-sdk = { git = "https://github.com/candymaps/geko.git", rev = "03b41187113b75055a2965de6d0dd08ab4164607" }
geko-module-tiles = { path = "." }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "fat"
codegen-units = 1
# Unwind, not abort: a bug in one request must never take the whole server down.
panic = "unwind"

[profile.ci]
inherits = "release"
lto = "thin"
codegen-units = 16

[package]
name = "geko-module-tiles"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
geko-module-sdk.workspace = true
tracing.workspace = true

[dev-dependencies]
geko-module-sdk = { workspace = true, features = ["conformance"] }
tempfile = "3"
