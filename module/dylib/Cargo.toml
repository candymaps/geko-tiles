[package]
name = "geko-module-tiles-dylib"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# The tiles module as a library that geko loads (`DylibModule`, docs/MODULES_PLAN.md): a crate of
# its own, so that linking it into the host never builds the `cdylib` too.
[lib]
name = "geko_tiles"
crate-type = ["cdylib"]

[dependencies]
geko-module-tiles.workspace = true
geko-module-sdk.workspace = true
tracing-subscriber.workspace = true
