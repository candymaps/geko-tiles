# The Geofabrik extracts of the countries whose regions carry no ISO 3166-2 code in the Geofabrik
# index, or that are split across extracts (src/extracts.rs). A country not listed takes the extracts
# the index gives its ISO code; a region not listed, those the index gives its code, or else the
# whole country. The same extracts as the geocoder's (countries/<cc>/sources/osm.toml there), so that
# both modules share their downloads.

# Spain: its regions carry no ISO 3166-2 code in the Geofabrik index, and the Canary Islands are an
# extract of Africa, not of Spain. Each province takes the extract of its autonomous community.
[es]
country = ["spain", "canary-islands"]

[es.regions]
ES-AN = "andalucia"
