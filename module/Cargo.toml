[package]
name = "geko-module-tiles"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
geko-module-sdk.workspace = true
geko-fetch.workspace = true
arc-swap = "1"
flate2 = "1"
memmap2 = "0.9"
osmpbf = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
toml = "0.8"
tracing.workspace = true
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
geko-module-sdk = { workspace = true, features = ["conformance"] }
tempfile = "3"
